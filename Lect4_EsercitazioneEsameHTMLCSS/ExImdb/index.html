<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Barra di navigazione -->
    <header>
        <div>
            <div>
                <a href="#"><img src="src/IMDB_Logo.png" alt="IMDb Logo"></a>
            </div>
            <div>
                <input type="text" placeholder="Cerca su IMDb">
            </div>
        </div>
    </header>

    <!-- Layout principale -->
    <main>
        <!-- Sezione principale -->
        <section>
            <div>
                <!-- Locandina (cliccabile) -->
                <div>
                    <a href="#"><img src="src/poster_biutiful.png" alt="Locandina di Biutiful"></a>
                </div>
                <!-- Play, titolo + link + rating, durata -->
                <div>
                    <div>
                        <a href="#"><img src="src/play_button.png" alt="Play button"></a>
                    </div>
                    <div>
                        <h1><a href="#">"Biutiful"</a></h1>
                        <a href="#">Watch the Trailer</a>
                        <p><span>Like 30</span><span>Love 5</span></p>
                    </div>
                    <div>
                        <p>2:28</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Sidebar -->
        <aside>
            <div>
                <h3>Successivo</h3>
            </div>
            <div>
                <div>
                    <div>
                        <a href="#"><img src="src/NoCountry_poster.png" alt="Locandina di No country for old men"></a>
                    </div>
                    <div>
                        <div>
                            <img src="src/play_button.png" alt="Play button">
                            <p>2:02</p>
                        </div>
                        <div>
                            <p><a href="#">'No country for old men'</a></p>
                            <a href="#">Watch the Trailer</a>
                            <p><span>Like 100</span><span>Love 52</span></p>
                        </div>
                    </div>
                </div>
                <div>
                    <div>
                        <a href="#"><img src="src/lolita_poster.png" alt="Locandina di Lolita"></a>
                    </div>
                    <div>
                        <div>
                            <img src="src/play_button.png" alt="Play button">
                            <p>2:17</p>
                        </div>
                        <div>
                            <p><a href="#">'Lolita'</a></p>
                            <a href="#">Watch the Trailer</a>
                            <p><span>Like 29</span><span>Love 5</span></p>
                        </div>
                    </div>
                </div>
                <div>
                    <div>
                        <a href="#"><img src="src/RequiemFAD_poster.png" alt="Locandina di Requiem for a dream"></a>
                    </div>
                    <div>
                        <div>
                            <img src="src/play_button.png" alt="Play button">
                            <p>1:42</p>
                        </div>
                        <div>
                            <p><a href="#">'Requiem for a dream'</a></p>
                            <a href="#">Watch the Trailer</a>
                            <p><span>Like 200</span><span>Love 81</span></p>
                        </div>
                    </div>
                </div>
            </div>
            <div>
                <h3><a href="#">Esplora trailer</a></h3>
            </div>
        </aside>
    </main>
</body>
</html>
